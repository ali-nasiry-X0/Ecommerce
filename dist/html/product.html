<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecommerce</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" href="../icons/logo/secondary-logo.svg" />
    <!-- <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
      eruda.init();
    </script> -->
    <script src="../js/pages/productDetail.js" defer type="module"></script>
  </head>
  <body>
    <section class="get-offer">
      <div class="container">
        <p class="get-offer-text text-regular">
          Get 25% OFF on your first order.
        </p>
        <a class="get-offer-cta text-medium" href="#">Order Now</a>
      </div>
    </section>
    <section class="navbar">
      <div class="container">
        <div class="navbar__logo">
          <img class="img" src="../icons/logo/secondary-logo.svg" alt="" />
          <h1 class="brand">Ecommerce</h1>
        </div>
        <div class="navbar__menu">
          <a class="menu-link" href="#">Home</a>
          <button class="menu-categories">
            <p class="menu-categories__title">Categories</p>
            <img
              class="menu-categories__chevron"
              src="../icons/ui/Chevron Down.svg"
              alt=""
            />
          </button>
          <a class="menu-link" href="#">About</a>
          <a class="menu-link" href="#">contact</a>
        </div>
        <div class="navbar__action">
          <div class="search">
            <img class="search__icon" src="../icons/ui/Search.svg" alt="" />
            <input
              class="search__input"
              type="text"
              placeholder="Search products"
            />
          </div>
          <a class="navbar__action__user" ahref="#"
            ><img src="../icons/ui/Cart.svg" alt=""
          /></a>
          <a class="navbar__action__card" href="#"
            ><img src="../icons/ui/User-1.svg" alt=""
          /></a>
        </div>
        <div class="navbar__popup__btn">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="navbar__popup__menu">
          <div class="navbar__popup__actions-general">
            <a class="menu-link" href="#">Home</a>
            <button class="menu-categories__popup">
              <p class="menu-categories__title">Categories</p>
              <img
                class="menu-categories__chevron"
                src="../icons/ui/Chevron Down.svg"
                alt=""
              />
            </button>
            <div class="menu-categories-items"></div>
            <a class="menu-link" href="#">About</a>
            <a class="menu-link" href="#">contact</a>
          </div>
          <div class="navbar__popup__actions-user">
            <a class="navbar__action__user" ahref="#"
              ><img src="../icons/ui/Cart.svg" alt=""
            /></a>
            <a class="navbar__action__card" href="#"
              ><img src="../icons/ui/User-1.svg" alt=""
            /></a>
          </div>
        </div>
      </div>
      <div class="navbar__popup__categories">
        <div class="categories__items"></div>
      </div>
    </section>
    <section class="breadCrumb">
      <div class="container">
        <a class="breadCrumb__main" href="./home.html">Ecommerce</a>
      </div>
    </section>
    <main class="product-detail">
      <div class="container">
        <div class="product-detail__purchase">
          <div class="product-detail__gallery">
            <div class="product-detail__pictures">
              <div class="product-detail__wrapper">
                <img src="../img/hero-pic.png" alt="" />
                <img src="../img/hero-pic.png" alt="" />
                <img src="../img/hero-pic.png" alt="" />
              </div>
            </div>
            <div class="product-detail__controls">
              <button type="button">1</button>
              <button type="button">2</button>
              <button type="button">3</button>
            </div>
          </div>
          <div class="product-detail__options">
            <div class="product-detail__title">
              <h3 class="product-detail__nameProduct"></h3>
              <img
                class="product-detail__shareIcon"
                src="../icons/ui/Share.svg"
                alt=""
              />
            </div>
            <div class="product-detail__generalInfo">
              <div class="product-detail__rank">
                <img src="../icons/ui/Star.svg" alt="" />
                <p class="product-detail__rank__content"></p>
              </div>
              <div class="product-detail__status"></div>
            </div>
            <p class="product-detail__price"></p>
            <div class="product-detail__optional">
              <template class="selectColors-template">
                <div class="product-detail__selectColors">
                  <p>AVAILABLE COLORS</p>
                  <div class="product-detail__colors">
                    <button class="product-detail__color"></button>
                  </div>
                </div>
              </template>
              <template class="selectSize-template">
                <div class="product-detail__selectSize">
                  <p>SELECT SIZE</p>
                  <div class="product-detail__size"></div>
                </div>
              </template>
            </div>
            <div class="product-detail__quantity">
              <p>QUANTITY</p>
              <div class="product-detail__quantityBox">
                <button>+</button>
                <input type="text" />
                <button>-</button>
              </div>
            </div>
            <div class="product-detail__actionProduct">
              <button class="product-detail__addToCart">Add to cart</button>
              <button class="like">
                <img src="../icons/ui/Heart.svg" alt="" />
              </button>
            </div>
            <p class="product-detail__proposal">
              — Free shipping on orders $100+
            </p>
          </div>
        </div>
        <div class="product-detail__information"></div>
      </div>
    </main>
  </body>
</html>
