<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecommerce</title>
    <link rel="stylesheet" href="../css/style.css" />
    <!-- <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
      eruda.init();
    </script> -->
    <script src="../js/main.js" defer type="module"></script>
  </head>
  <body>
    <section class="get-offer">
      <div class="container">
        <p class="get-offer-text text-regular">
          Get 25% OFF on your first order.
        </p>
        <a class="get-offer-cta text-medium" href="#">Order Now</a>
      </div>
    </section>
    <section class="navbar">
      <div class="container">
        <div class="navbar__logo">
          <img class="img" src="../icons/logo/Logo.svg" alt="" />
          <h1 class="brand">Ecommerce</h1>
        </div>
        <div class="navbar__menu">
          <a class="menu-link" href="#">Home</a>
          <button class="menu-categories">
            <p class="menu-categories__title">Categories</p>
            <img
              class="menu-categories__chevron"
              src="../icons/ui/Chevron Down.svg"
              alt=""
            />
          </button>
          <a class="menu-link" href="#">About</a>
          <a class="menu-link" href="#">contact</a>
        </div>
        <div class="navbar__action">
          <div class="search">
            <img class="search__icon" src="../icons/ui/Search.svg" alt="" />
            <input
              class="search__input"
              type="text"
              placeholder="Search products"
            />
          </div>
          <a class="navbar__action__user" ahref="#"
            ><img src="../icons/ui/Cart.svg" alt=""
          /></a>
          <a class="navbar__action__card" href="#"
            ><img src="../icons/ui/User-1.svg" alt=""
          /></a>
        </div>
        <div class="navbar__popup__btn">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="navbar__popup__menu">
          <div class="navbar__popup__actions-general">
            <a class="menu-link" href="#">Home</a>
            <button class="menu-categories__popup">
              <p class="menu-categories__title">Categories</p>
              <img
                class="menu-categories__chevron"
                src="../icons/ui/Chevron Down.svg"
                alt=""
              />
            </button>
            <div class="menu-categories-items"></div>
            <a class="menu-link" href="#">About</a>
            <a class="menu-link" href="#">contact</a>
          </div>
          <div class="navbar__popup__actions-user">
            <a class="navbar__action__user" ahref="#"
              ><img src="../icons/ui/Cart.svg" alt=""
            /></a>
            <a class="navbar__action__card" href="#"
              ><img src="../icons/ui/User-1.svg" alt=""
            /></a>
          </div>
        </div>
      </div>
      <div class="navbar__popup__categories">
        <div class="categories__items"></div>
      </div>
    </section>
    <section class="hero">
      <div class="container">
        <div class="hero__content">
          <div class="hero__content__text">
            <h2>Fresh Arrivals Online</h2>
            <p>Discover Our Newest Collection Today.</p>
          </div>
          <button class="btn btn--primary hero__cta">
            View Collection <img src="../icons/ui/Arrow Right.svg" alt="" />
          </button>
        </div>
        <div class="hero__picture">
          <img src="../img/hero-pic.png " alt="" />
        </div>
      </div>
    </section>
  </body>
</html>
